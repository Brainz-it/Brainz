# Déploie le dossier `wedding/` sur GitHub Pages à chaque modification.
# Activez Pages dans Settings → Pages → Source : "GitHub Actions".
name: Deploy wedding site

on:
  push:
    branches: [main]
    paths: ["wedding/**", ".github/workflows/deploy-wedding.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-wedding
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wedding
      - id: deployment
        uses: actions/deploy-pages@v4
